<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D2 Project Management - Premium Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --gold: #fbbf24; --gold-dark: #b45309; --d2-blue: #0f172a; }
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s; margin: 0; }
        
        /* LOGIN STYLE */
        .auth-body { background-color: #f1f5f9; color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { 
            background: white; border-radius: 40px; width: 100%; max-width: 440px;
            padding: 48px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); text-align: center;
        }
        .logo-box { background: var(--d2-blue); border-radius: 20px; padding: 20px; display: inline-block; margin-bottom: 24px; }
        .label-auth { font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: block; text-align: left; }
        .auth-input {
            width: 100%; padding: 16px 20px; border-radius: 12px; background: #f8fafc;
            border: 1px solid #e2e8f0; color: #0f172a; outline: none; transition: all 0.2s; font-size: 15px;
        }
        .auth-input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.1); }
        .btn-access {
            width: 100%; background: var(--d2-blue); color: white; padding: 18px;
            border-radius: 14px; font-weight: 800; text-transform: uppercase; 
            letter-spacing: 0.1em; transition: all 0.3s; margin-top: 10px; border: none; cursor: pointer;
        }
        .btn-access:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(15, 23, 42, 0.2); }

        /* APP INTERFACE */
        .app-body-dark { background-color: #030508; color: #f1f5f9; }
        .modern-input { 
            width: 100%; padding: 14px 16px; border-radius: 12px; 
            border: 1px solid rgba(148, 163, 184, 0.2); background: rgba(0,0,0,0.5); 
            color: inherit; outline: none; transition: all 0.2s; font-size: 14px;
        }
        .light .modern-input { background: #fff; border: 1px solid #cbd5e1; color: #000; }
        .modern-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1); }

        /* Icones */
        .password-toggle { 
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%); 
            z-index: 100; color: var(--gold); cursor: pointer; 
            background: rgba(0,0,0,0.2); border-radius: 8px; padding: 6px;
            display: flex; align-items: center; justify-content: center; border: 1px solid rgba(251, 191, 36, 0.3);
        }
        .password-toggle svg { width: 18px; height: 18px; stroke-width: 2.5; }

        /* Botão Premium Gold */
        .btn-premium-gold {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #000; font-weight: 900; padding: 16px; border-radius: 14px;
            text-transform: uppercase; letter-spacing: 0.1em; border: none;
            width: 100%; cursor: pointer; transition: all 0.3s; text-align: center;
        }
        .btn-premium-gold:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4); }

        /* Filtros */
        .unit-pill { padding: 8px 20px; border-radius: 20px; font-size: 10px; font-weight: 800; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s; color: #64748b; background: transparent; }
        .unit-pill.active { background: var(--gold); color: #000; border-color: var(--gold); }

        /* Calendário */
        .date-container input[type="date"]::-webkit-calendar-picker-indicator {
            background: transparent; bottom: 0; color: transparent; cursor: pointer;
            height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto; z-index: 20;
        }
        .date-container { position: relative; display: flex; align-items: center; width: 100%; }
        .date-container input[type="date"] { position: relative; }
        .calendar-icon-overlay { position: absolute; right: 14px; pointer-events: none; color: var(--gold); z-index: 10; }

        /* Date inputs (dark mode): make calendar icon visible and avoid overlap */
        .app-body-dark input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.85; }
        .light input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0); opacity: 0.65; }
        .app-body-dark .finance-panel input[type="date"],
        .app-body-dark input.modern-input[type="date"] { padding-right: 40px !important; }

        /* Paineis */
        .finance-panel { max-height: 0; overflow: hidden; transition: all 0.5s ease-out; opacity: 0; }
        .finance-panel.open { max-height: 1000px; opacity: 1; margin-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem; }

        /* Barra de Progresso */
        .progress-track { height: 16px; border-radius: 8px; background: rgba(255,255,255,0.05); overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .progress-bar-fill { height: 100%; transition: width 1.2s ease-in-out; border-radius: 8px; }

        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tab-active { color: var(--gold); border-bottom: 3px solid var(--gold); }
        .status-badge { width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px currentColor; }
        
        /* Select Contrast */
        select.modern-input { background-color: #1a1c23; cursor: pointer; }
        select option { background-color: #1a1c23; color: white; padding: 10px; }

        /* Input Wrappers */
        .input-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
        .input-prefix { position: absolute; left: 16px; font-weight: 800; color: var(--gold); pointer-events: none; z-index: 10; }
        .input-suffix { position: absolute; right: 16px; font-weight: 800; color: var(--gold); pointer-events: none; z-index: 10; }
        .pl-10 { padding-left: 40px !important; }
        .pr-10 { padding-right: 40px !important; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @media print { .no-print { display: none !important; } }
    
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
    }
</style>
</head>
<body id="body-root" class="auth-body">

            <div id="report-output"></div>

    </main>
</div>

    const formatCurr = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 }).format(v);

    // --- MONEY INPUT HELPERS (accepts 1,000.00 and formats on blur) ---
    function parseMoney(value) {
        if (value === null || value === undefined) return 0;
        const s = String(value).trim()
            .replace(/\$/g, '')
            .replace(/\s+/g, '')
            .replace(/,/g, '');
        // keep only digits and one dot
        const cleaned = s.replace(/[^0-9.]/g, '');
        if (!cleaned) return 0;
        const parts = cleaned.split('.');
        const normalized = parts.length === 1 ? parts[0] : (parts[0] + '.' + parts.slice(1).join(''));
        const num = Number(normalized);
        return Number.isFinite(num) ? num : 0;
    }

    function formatMoneyInput(num) {
        const n = Number(num);
        if (!Number.isFinite(n)) return '';
        return new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
    }

    function normalizeMoneyString(value) {
        if (value === null || value === undefined) return '';
        const s = String(value).trim()
            .replace(/\$/g, '')
            .replace(/\s+/g, '')
            .replace(/,/g, '')
            .replace(/[^0-9.]/g, '');
        if (!s) return '';
        const parts = s.split('.');
        const head = parts[0];
        const tail = parts.slice(1).join('');
        const dec = tail ? tail.slice(0, 2) : '';
        return dec ? `${head}.${dec}` : head;
    }

    function attachMoneyMasks(root = document) {
        const els = root.querySelectorAll('[data-money="usd"]');
        els.forEach((el) => {
            if (el.__moneyBound) return;
            el.__moneyBound = true;

            const sanitizeWithCaret = (value, caretPos) => {
                const s = String(value ?? '');
                let out = '';
                let newPos = caretPos;
                let seenDot = false;
                let decCount = 0;

                for (let i = 0; i < s.length; i++) {
                    const ch = s[i];
                    const isBeforeCaret = i < caretPos;

                    if (ch >= '0' && ch <= '9') {
                        if (seenDot) {
                            if (decCount >= 2) {
                                if (isBeforeCaret) newPos -= 1;
                                continue;
                            }
                            decCount += 1;
                        }
                        out += ch;
                        continue;
                    }

                    if (ch === '.') {
                        if (seenDot) {
                            if (isBeforeCaret) newPos -= 1;
                            continue;
                        }
                        seenDot = true;
                        out += ch;
                        continue;
                    }

                    // ignore any other character ($, comma, space, etc.)
                    if (isBeforeCaret) newPos -= 1;
                }

                if (newPos < 0) newPos = 0;
                if (newPos > out.length) newPos = out.length;
                return { out, newPos };
            };

            el.addEventListener('input', () => {
                const caret = el.selectionStart ?? el.value.length;
                const { out, newPos } = sanitizeWithCaret(el.value, caret);
                if (out !== el.value) {
                    el.value = out;
                    try { el.setSelectionRange(newPos, newPos); } catch (_) {}
                }
            });

            el.addEventListener('blur', () => {
                const raw = String(el.value ?? '').trim();
                if (!raw) return;
                const n = parseMoney(raw);
                el.value = formatMoneyInput(n);
            });
        });
    }

    window.addPayment = async (projectId, ev) => {
        // prevent any default behavior that could open date pickers or trigger other handlers
        try { ev?.preventDefault?.(); ev?.stopPropagation?.(); } catch(_) {}

        const valInput = document.getElementById(`pay-val-${projectId}`);
        const dateInput = document.getElementById(`pay-date-${projectId}`);
        const btn = document.getElementById(`pay-btn-${projectId}`);

        const amount = parseMoney(valInput ? valInput.value : 0);
        const d = dateInput ? dateInput.value : '';

        if (!amount || amount <= 0) return alert('Informe um valor válido.');
        if (!d) return alert('Selecione uma data válida.');

        const proj = state.projects.find(x => x.id === projectId);
        const fin = proj ? getFin(proj) : null;
        if (fin) {
            const newTotal = fin.totalPaid + amount;
            const newBalance = fin.commTotal - newTotal;
            // If this payment makes it overpaid, require confirmation so it can be corrected.
            if (newBalance < -0.009) {
                const over = Math.abs(newBalance);
                const msg = `ATENÇÃO: Este lançamento deixará o projeto com pagamento excedente de ${formatCurr(over)}.

Deseja salvar mesmo assim? (Recomendado: corrigir o valor antes de salvar)`;
                if (!confirm(msg)) return;
            }
        }

        try {
            if (btn) { btn.disabled = true; btn.innerText = 'Salvando...'; }
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'projects', projectId);
            await updateDoc(ref, { pagamentosEfetuados: arrayUnion({ valor: Math.round(amount * 100) / 100, data: d }) });

            if (valInput) valInput.value = '';
            if (dateInput) dateInput.value = '';
            if (btn) {
                btn.innerText = 'Salvo ✓';
                setTimeout(() => { btn.disabled = false; btn.innerText = 'Lançar Pagamento'; }, 1200);
            }
        } catch(e){
            console.error(e);
            if (btn) { btn.disabled = false; btn.innerText = 'Lançar Pagamento'; }
            alert('Erro ao salvar pagamento.');
        }
    };

            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'projects', projectId);

        }
    };

    function getFin(p) {
        const metodo = (p && p.metodo) ? String(p.metodo) : '';
        let isCC = (metodo === 'CC' || metodo.toLowerCase().includes('cartão') || metodo.toLowerCase().includes('credit'));
        let base = isCC ? p.valorTotal * 0.97 : p.valorTotal;
        let commTotal = base * (p.percComissao / 100);
        let pays = p.pagamentosEfetuados || [];
        let totalPaid = pays.reduce((a, c) => a + parseFloat(c.valor), 0);
        // balance can be negative (overpayment). Keep it raw for warnings/UI.
        let balance = (commTotal - totalPaid);
        let underPaid = Math.max(0, balance);
        let overPaid = Math.max(0, -balance);
        let statusColor = totalPaid >= commTotal ? "bg-emerald-500" : (totalPaid > 0 ? "bg-orange-500" : "bg-red-500");
        return { base, commTotal, totalPaid, balance, underPaid, overPaid, statusColor, isCC, pays }; // Retornando pays para usar no render
    }

    function renderProjects() {
        const grid = document.getElementById('view-projects'); if (!grid || !state.user) return;
        grid.innerHTML = ''; const t = translations[state.lang];
        const filtered = state.projects.filter(p => state.company === 'Ambas' || p.empresa === state.company);
        filtered.forEach(p => {
            const start = new Date(p.dataInicio).getTime(), end = new Date(p.dataEntrega).getTime(), now = new Date().getTime();
            let prog = 0; if (now >= start) prog = now >= end ? 100 : Math.floor(((now - start) / (end - start)) * 100);
            const daysLeft = Math.ceil((end - now) / (1000 * 3600 * 24));
            
            // Degradê Dinâmico: Verde -> Amarelo -> Vermelho
            
let colorHex = `rgb(${Math.floor(Math.min(255, (prog/50)*255))}, ${Math.floor(Math.min(255, (2-prog/50)*255))}, 0)`;
const isOverdue = (now > end) && (p.status !== 'Finalizado');
if (isOverdue) colorHex = 'rgb(180, 0, 0)';

            const fin = getFin(p);

            grid.innerHTML += `
                <div class="glass p-8 rounded-[40px] border-l-[8px] relative shadow-2xl" style="border-left-color: ${p.status === 'Finalizado' ? '#10b981' : '#f59e0b'}">
                    <div class="absolute top-6 right-6 flex items-center gap-3"><span class="status-badge ${fin.statusColor}"></span><button onclick="window.editP('${p.id}')"><i data-lucide="edit-3" class="w-4 h-4 text-slate-400"></i></button><button onclick="window.deleteP('${p.id}')"><i data-lucide="trash-2" class="w-4 h-4 text-red-400"></i></button></div>
                    <div class="mb-6 text-left"><h4 class="font-black text-xl uppercase truncate pr-20">${p.cliente}</h4><p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">${p.vendedor} • ${p.metodo}</p></div>
                    <div class="space-y-3 mb-8 text-left">
                        <div class="flex justify-between text-[10px] font-black uppercase text-slate-400"><span>${t.timeline}</span><span style="color: ${colorHex}">${prog}%</span></div>
                        <div class="progress-track"><div class="progress-bar-fill" style="width: ${prog}%; background-color: ${colorHex}; ${isOverdue ? 'animation: pulse 1s infinite' : ''}"></div></div>
                        <div class="flex justify-between text-[9px] font-extrabold uppercase"><span>${new Date(p.dataInicio).toLocaleDateString()}</span><span class="${isOverdue ? 'text-red-500 font-black' : 'text-gold'}">${isOverdue ? t.status_overdue : (prog === 100 ? t.status_finished : daysLeft + ' ' + t.days_left)}</span></div>
                    </div>
                    <div class="bg-black/30 p-6 rounded-3xl border border-white/5 shadow-inner"><p class="text-[9px] font-black text-slate-500 uppercase mb-1 text-center">Valor do Contrato</p><p class="text-2xl font-black text-white text-center">${formatCurr(p.valorTotal)}</p></div>
                    
                    <button onclick="window.toggleFinance('${p.id}')" class="w-full mt-6 py-2 text-[10px] font-black uppercase text-gold hover:underline flex items-center justify-center gap-2"><i data-lucide="wallet" class="w-4 h-4"></i> ${t.finance_btn}</button>
                    <div id="fin-${p.id}" class="finance-panel">
                        <div class="bg-gold/5 p-4 rounded-2xl border border-gold/10 space-y-4 text-left">
                            <div class="flex justify-between"><div><p class="text-[8px] font-bold text-gold/60 uppercase">Comissão Total ${fin.isCC ? '(Net -3%)' : ''}</p><p class="text-lg font-black text-gold">${formatCurr(fin.commTotal)}</p></div>
                            <div class="text-right"><p class="text-[8px] font-bold text-gold/60 uppercase">${fin.balance >= 0 ? 'Saldo a Pagar' : 'Pago a Mais'}</p><p class="text-lg font-black ${fin.balance >= 0 ? (fin.balance > 0 ? 'text-red-400' : 'text-emerald-400') : 'text-emerald-400'}">${formatCurr(Math.abs(fin.balance))}</p></div></div>
                            ${fin.balance > 0 ? `
                                <div class="mt-3 p-3 rounded-xl border border-red-500/20 bg-red-500/5 text-[10px] font-extrabold uppercase tracking-widest text-red-300">
                                    Falta pagar <span class="text-red-200">${formatCurr(fin.balance)}</span>.
                                </div>
                            ` : (fin.balance < 0 ? `
                                <div class="mt-3 p-3 rounded-xl border border-emerald-500/20 bg-emerald-500/5 text-[10px] font-extrabold uppercase tracking-widest text-emerald-200">
                                    Pagamento excedente de <span class="text-emerald-100">${formatCurr(-fin.balance)}</span>.
                                </div>
                            ` : '')}
                            <div class="space-y-2">
                                <p class="text-[9px] font-black text-slate-500 uppercase border-b border-white/5 pb-1">${t.history}</p>
                                <div class="max-h-32 overflow-y-auto scrollbar-hide">
                                    ${(fin.pays).map(pay => {
                                        const canRemove = (state.user?.email === SUPER_ADMIN);
                                        const onclick = canRemove ? `onclick=\"window.removePayment('${p.id}', ${Number(pay.valor)}, '${pay.data}')\"` : '';
                                        const cls = canRemove ? 'cursor-pointer hover:bg-white/5 rounded-lg px-2' : '';
                                        const hint = canRemove ? 'title=\"Clique para remover (Admin)\"' : '';
                                        return `<div class=\"flex justify-between text-[10px] py-1 border-b border-white/5 ${cls}\" ${onclick} ${hint}><span>${new Date(pay.data).toLocaleDateString()}</span><span class=\"font-bold text-emerald-500\">+ ${formatCurr(pay.valor)}</span></div>`;
                                    }).join('') || '<p class="text-[9px] italic opacity-50">Nenhum pagamento registrado</p>'}
                                </div>
                            </div>
                            <div class="mt-4 pt-4 border-t border-white/5 admin-only ${state.user?.email !== SUPER_ADMIN ? 'hidden' : ''}">
                                <div class="grid grid-cols-2 gap-2"><input type="text" id="pay-val-${p.id}" inputmode="decimal" autocomplete="off" placeholder="$" class="modern-input !pl-4 h-10" data-money="usd"><input type="date" id="pay-date-${p.id}" class="modern-input !pl-4 !pr-10 h-10"></div>
                                <button type="button" id="pay-btn-${p.id}" onclick="window.addPayment('${p.id}', event)" class="w-full mt-2 btn-premium-gold !py-2 !text-[9px]">Lançar Pagamento</button>

    function renderReport() {
        const out = document.getElementById('report-output'); if (!out || !state.user) return;
        const t = translations[state.lang]; let tv = 0, tc = 0;
        const filtered = state.projects.filter(p => state.company === 'Ambas' || p.empresa === state.company);
        const rows = filtered.map(p => {
            const f = getFin(p); tv += p.valorTotal; tc += f.commTotal;
            const sD = new Date(p.dataInicio).getTime(), eD = new Date(p.dataEntrega).getTime(), nD = new Date().getTime();
            let prog = nD >= sD ? (nD > eD ? 100 : Math.floor(((nD - sD) / (eD - sD)) * 100)) : 0;
            return `<tr class="border-b border-slate-100 text-xs text-left text-slate-800"><td class="p-4 font-black uppercase">${p.cliente}</td><td class="p-4">${p.vendedor}</td><td class="p-4 text-center">${prog}%</td><td class="p-4 text-right">${formatCurr(p.valorTotal)}</td><td class="p-4 text-right text-slate-400 italic">${formatCurr(f.base)}</td><td class="p-4 text-right font-black text-amber-600">${formatCurr(f.commTotal)}</td></tr>`;
        }).join('');
        out.innerHTML = `<div class="bg-white text-slate-950 p-12 rounded-[50px] shadow-2xl border-8 border-slate-50 text-left"><div class="flex justify-between items-center border-b-[8px] border-slate-950 pb-10 mb-10"><div class="logo-frame-sm border p-2 rounded-xl"><img src="logo-D2-Group-preto.png" class="h-12"></div><div class="text-right"><h2 class="text-3xl font-black uppercase tracking-tighter">${t.report_title}</h2><p class="text-slate-400 font-black uppercase text-[10px]">${new Date().toLocaleDateString()}</p></div></div><div class="overflow-x-auto"><table class="w-full"><thead><tr class="bg-slate-50 font-black uppercase text-[10px] text-slate-500 text-left"><th class="p-4">${t.col_obra}</th><th class="p-4">${t.col_vendedor}</th><th class="p-4 text-center">${t.col_andamento}</th><th class="p-4 text-right">${t.col_contrato}</th><th class="p-4 text-right">${t.col_base}</th><th class="p-4 text-right">${t.col_comm}</th></tr></thead><tbody>${rows}</tbody></table></div><div class="mt-10 pt-10 border-t-[8px] border-slate-950 flex justify-end gap-16"><div class="text-right"><p class="text-[11px] font-black uppercase text-slate-400 mb-1">TOTAL GERAL</p><p class="text-4xl font-black">${formatCurr(tv)}</p></div><div class="text-right"><p class="text-[11px] font-black uppercase text-amber-600 mb-1">TOTAL COMISSÕES</p><p class="text-4xl font-black text-amber-600">${formatCurr(tc)}</p></div></div></div>`;
    }

    onAuthStateChanged(auth, (u) => {
        state.user = u;
        if(u){ 
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.body.className = 'app-body-dark';
            document.getElementById('user-display').innerText = u.email ? u.email.split('@')[0].toUpperCase() : "USR"; 
            if(u.email === SUPER_ADMIN) document.querySelectorAll('.admin-only').forEach(e => e.classList.remove('hidden')); 
            initData();
            window.showView('projects'); 
        } else {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('main-app').classList.add('hidden');
            document.body.className = 'auth-body';
        }
        setLang(state.lang);
    });

    function initData() { 
        if (!auth.currentUser) return;
        const projectsRef = collection(db, 'artifacts', appId, 'public', 'data', 'projects');
        onSnapshot(projectsRef, snap => { state.projects = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderProjects(); renderReport(); }, err => console.log(err)); 
        if(auth.currentUser.email === SUPER_ADMIN) {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'user_credentials'), snap => {
                const team = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const container = document.getElementById('users-list'); if (!container) return;
                container.innerHTML = team.map(u => `<div class="glass p-6 rounded-[24px] flex justify-between items-center border-l-8 border-gold shadow-lg transition-all hover:scale-[1.01]"><div class="text-left"><p class="font-black text-slate-100 text-lg">${u.email}</p><p class="text-[11px] text-slate-500 mt-1 uppercase tracking-widest">Senha: <span class="text-gold font-bold normal-case">${u.password}</span></p></div><div class="flex gap-2"><button onclick="window.editTeamMember('${u.id}', '${u.email}', '${u.password}')" class="p-2 text-gold hover:bg-gold/10 rounded-lg"><i data-lucide="edit" size="18"></i></button><button onclick="window.deleteTeam('${u.id}')" class="p-2 text-red-500 hover:bg-red-500/10 rounded-lg"><i data-lucide="user-minus" size="18"></i></button></div></div>`).join('');
                lucide.createIcons();
            });
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        attachMoneyMasks(document);

        document.getElementById('login-form').onsubmit = async (e) => { 
            e.preventDefault();
            document.getElementById('login-error-msg').classList.add('hidden');
            const btn = document.getElementById('btn-entrar');
            btn.disabled = true;
            try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); } 
            catch(err){ document.getElementById('login-error-msg').classList.remove('hidden'); btn.disabled = false; } 
        };

        document.getElementById('project-form').onsubmit = async (e) => { 
            e.preventDefault(); if (!auth.currentUser) return;
            const id = document.getElementById('edit-id').value; 
            const d = { 
                empresa: document.getElementById('f-empresa').value, 
                cliente: document.getElementById('f-cliente').value, 
                vendedor: document.getElementById('f-vendedor').value, 
                proposta: document.getElementById('f-proposta').value, 
                invoice: document.getElementById('f-invoice').value, 
                valorTotal: parseMoney(document.getElementById('f-valor').value), 
                metodo: document.getElementById('f-metodo').value, 
                percComissao: parseInt(document.getElementById('f-comm').value), 
                dataInicio: document.getElementById('f-inicio').value, 
                dataEntrega: document.getElementById('f-entrega').value, 
                status: document.getElementById('f-status').value, 
                updatedAt: serverTimestamp() 
            }; 
            try { 
                if(id) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', id), d); 
                else await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), { ...d, createdAt: serverTimestamp(), pagamentosEfetuados: [] }); 
                e.target.reset(); document.getElementById('edit-id').value = ''; window.showView('projects'); 
            } catch(err){ console.log(err); } 
        };

        document.getElementById('team-form').onsubmit = async (e) => {
            e.preventDefault(); if (!auth.currentUser) return;
            const id = document.getElementById('t-id').value, mail = document.getElementById('t-email').value, pass = document.getElementById('t-pass').value;
            try { 
                if(!id) {
                    const tempName = `AuthTemp_${Date.now()}`;
                    const tempApp = initializeApp(firebaseConfig, tempName);
                    const tempAuth = getAuth(tempApp);
                    await createUserWithEmailAndPassword(tempAuth, mail, pass);
                    await deleteApp(tempApp);
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'user_credentials'), { email: mail, password: pass, updatedAt: serverTimestamp() }); 
                } else {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'user_credentials', id), { email: mail, password: pass, updatedAt: serverTimestamp() });
                }
                e.target.reset(); document.getElementById('t-id').value = '';
            } catch(err){ alert("Erro: " + err.message); }
        };
    });
